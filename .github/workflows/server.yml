name: PHP CI

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feat/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, 'release/v*', 'dev-v*', release/v*, dev-v* ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_AUTH_TOKEN: ${{ secrets._GITHUB_AUTH_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, gd, zip, pdo_mysql, sockets, intl, bcmath, gmp 
        coverage: xdebug

    - name: Update and Install additional packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libzip-dev libgd-dev libfreetype6-dev libjpeg-dev libpng-dev imagemagick libmagickwand-dev libmemcached-dev libgeos-dev libgmp-dev default-mysql-client libicu-dev
      
    # Label PDFs render through Chromium (spatie/laravel-pdf + Browsershot). Without
    # Chromium and Puppeteer the Browsershot tests skip and that path counts as
    # uncovered, which fails the 100% coverage gate below.
    - name: Install Chromium, Puppeteer and Thai fonts for label rendering
      run: |
        # GitHub's ubuntu runners ship Google Chrome; only the Thai fonts are missing.
        sudo apt-get install -y --no-install-recommends fonts-thai-tlwg fontconfig
        CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
        echo "Using Chrome at $CHROME_BIN"; "$CHROME_BIN" --version
        mkdir -p "$RUNNER_TEMP/pdf-renderer" && cd "$RUNNER_TEMP/pdf-renderer"
        PUPPETEER_SKIP_DOWNLOAD=true npm install --no-audit --no-fund puppeteer@24
        echo "LARAVEL_PDF_CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
        echo "LARAVEL_PDF_NODE_MODULES_PATH=$RUNNER_TEMP/pdf-renderer/node_modules" >> "$GITHUB_ENV"
        echo "LARAVEL_PDF_NO_SANDBOX=true" >> "$GITHUB_ENV"

    # Forks don't have the upstream secret; skip instead of failing the step.
    - name: Configure Composer Auth for Github
      if: ${{ env.GH_AUTH_TOKEN != '' }}
      run: composer config --global github-oauth.github.com "$GH_AUTH_TOKEN"

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Lint
      run: composer lint

    - name: Run Tests
      run: composer test:unit

    - name: Generate Coverage Baseline
      run: XDEBUG_MODE=coverage composer coverage:baseline

    # Asserts the gate against the report the step above just wrote.
    # `composer coverage:check` would regenerate it first, which means running
    # the whole suite under coverage a second time.
    - name: Enforce Coverage Gate
      run: php scripts/coverage-summary.php coverage/clover.xml --fail-under=100

    - name: Upload Coverage Baseline
      if: ${{ always() && hashFiles('coverage/clover.xml') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: fleetops-coverage-clover
        path: coverage/clover.xml
        if-no-files-found: error

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage/clover.xml
        disable_search: true
        flags: backend
        fail_ci_if_error: false
